<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - InvenTech</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <!-- FX de fondo -->
  <div class="fx fx-grid" aria-hidden="true"></div>
  <div class="fx fx-stars" aria-hidden="true"></div>
  <div class="fx fx-blob fx-blob-1" aria-hidden="true"></div>
  <div class="fx fx-blob fx-blob-2" aria-hidden="true"></div>
  <div class="fx auth-beam" aria-hidden="true"></div>
  <div class="fx auth-scanlines" aria-hidden="true"></div>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/" class="logo">
        <i class="fas fa-cube logo-icon"></i>
        <span class="logo-text text-gradient">InvenTech</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Inicio</a>
        <a href="register.html" class="btn btn-primary btn-neon">Crear cuenta</a>
      </div>
      <button class="menu-toggle"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <main class="auth-container">
    <section class="auth-card animate-on-scroll in-view">
      <header class="auth-header">
        <h1 class="auth-title text-gradient">Iniciar sesión</h1>
        <p class="auth-subtitle">Accede a tu panel de inventario</p>
      </header>

      <form class="form" id="login-form" method="post" action="#">
        <div class="input-group">
          <i class="fa-solid fa-user input-icon"></i>
          <input id="identity" name="identity" type="text" class="input-control" placeholder="Usuario o correo" required />
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock input-icon"></i>
          <input id="password" name="password" type="password" class="input-control" placeholder="Contraseña" required />
          <button type="button" class="toggle-visibility" data-toggle="password" data-target="password" aria-label="Mostrar u ocultar contraseña">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" name="remember" /> Mantener sesión
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <div class="auth-actions">
          <button class="btn btn-xl btn-neon btn-full" type="submit">Acceder <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </form>

      <p class="auth-alt">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
    </section>
  </main>

  <script src="js/landing.js"></script>
  <script src="js/auth.js"></script>
  </body>
  </html>
